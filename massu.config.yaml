# Massu AI Configuration
# Generated by: npx massu init (schema_version=2, detection-driven)
# Documentation: https://massu.ai/docs/getting-started/configuration

schema_version: 2
project:
  name: massu
  root: auto
framework:
  type: multi
  router: none
  orm: none
  ui: none
  primary: typescript
  languages:
    javascript:
      source_dirs:
        - website
        - scripts
        - eslint-rules
    typescript:
      test_framework: vitest
      source_dirs:
        - website
        - packages
        - scripts
        - .
paths:
  source: website
  aliases:
    "@": src
  monorepo_roots:
    - packages
toolPrefix: massu
domains: []
rules:
  - pattern: src/**/*.ts
    rules:
      - Use ESM imports (import/export), not CommonJS (require/module.exports)
      - All database operations go through better-sqlite3
  - pattern: src/hooks/**/*.ts
    rules:
      - Hooks receive JSON on stdin, output JSON on stdout
      - Hooks must exit within 5 seconds
      - Never import heavy dependencies - hooks must be fast
verification:
  javascript:
    test: cd website && npm test
    build: cd website && npm run build
    lint: cd website && npx eslint .
  typescript:
    test: cd website && npm test
    type: cd website && npx tsc --noEmit
    build: cd website && npm run build
    lint: cd website && npx eslint .
detection:
  fingerprint: 77072ac20da3b1d3cc03c03f2f70c52003b41531de42d6d15304e9c9f79394f9
analytics:
  quality:
    weights:
      bug_found: -5
      vr_failure: -10
      incident: -20
      cr_violation: -3
      vr_pass: 2
      clean_commit: 5
      successful_verification: 3
    categories:
      - security
      - architecture
      - coupling
      - tests
      - rule_compliance
  cost:
    models:
      claude-opus-4-6:
        input_per_million: 15
        output_per_million: 75
        cache_read_per_million: 1.5
        cache_write_per_million: 3.75
      claude-sonnet-4-5-20250929:
        input_per_million: 3
        output_per_million: 15
        cache_read_per_million: 0.3
        cache_write_per_million: 0.75
    currency: USD
  prompts:
    success_indicators:
      - committed
      - approved
      - looks good
      - perfect
      - great
      - thanks
    failure_indicators:
      - revert
      - wrong
      - that's not
      - undo
      - incorrect
    max_turns_for_success: 2
# plan-v0.2-interactive-rule-approval P-D-008: project-configured rule
# destinations. Massu is generalized — project-specific destinations
# (e.g. brand-voice.md, security/runbook.md) are config-driven, NEVER
# framework-baked. Empty array is the default (no custom destinations);
# uncomment + edit the example below to opt in. The `template` field is
# rendered via the RCE-safe template-renderer.ts with the allowed-vars
# set {date, slug, score, signals_csv, prompt_preview, destination_name}.
autoLearning:
  customDestinations: []
  # Example (commented):
  # - name: brand-voice
  #   path: docs/brand-voice.md
  #   triggerKeywords:
  #     - brand voice
  #     - copywriting tone
  #   template: |
  #     ## ${date}
  #     ${prompt_preview}
  #     - source: interactive rule approval
governance:
  audit:
    formats:
      - summary
      - detailed
      - soc2
    retention_days: 365
    auto_log:
      code_changes: true
      rule_enforcement: true
      approvals: true
      commits: true
  validation:
    realtime: true
    checks:
      rule_compliance: true
      import_existence: true
      naming_conventions: true
  adr:
    detection_phrases:
      - chose
      - decided
      - switching to
      - moving from
      - going with
    storage: database
security:
  auto_score_on_edit: true
  score_threshold_alert: 50
  severity_weights:
    critical: 25
    high: 15
    medium: 8
    low: 3
  restrictive_licenses:
    - GPL
    - AGPL
    - SSPL
  dependencies:
    package_manager: npm
    blocked_packages: []
    max_bundle_size_kb: 500
team:
  enabled: false
  sync_backend: local
  expertise_weights:
    session: 20
    observation: 10
  privacy:
    share_file_paths: true
    share_code_snippets: false
    share_observations: true
regression:
  test_runner: npm test
  test_patterns:
    - "{dir}/__tests__/{name}.test.{ext}"
    - "{dir}/{name}.spec.{ext}"
  health_thresholds:
    healthy: 80
    warning: 50

# Living-memory automatic relevant-recall (memory-recall hook + hybrid search).
# All keys optional with production-ready defaults; existing configs need no
# change. The `recall` block tunes what the hook injects each turn.
memory:
  recall:
    # enabled: master switch for the "🧠 Relevant memory" injection.
    enabled: true
    # maxTokens: hard cap on the injected block size.
    maxTokens: 1200
    # --- Semantic embedder (plan-living-memory-slice-2a-embedder) ---
    # embedEnabled: Tier-1 bundled pure-WASM embedder (all-MiniLM-L6-v2, 384-dim)
    #   is ON by default — meaning-based recall with ZERO egress and no native
    #   module, works offline. Set false to force keyword-only (FTS) recall.
    embedEnabled: true
    # embedEndpoint (optional): Tier-0 opt-in. An OpenAI-compatible
    #   /v1/embeddings provider (e.g. a local server or a cloud endpoint).
    #   When set, prompt text egresses ONLY to this endpoint you choose; when
    #   unset (default) embedding is 100% local. Must be an http(s) URL.
    #   Example: embedEndpoint: "http://localhost:11434"
    # embedModel (optional): the model name sent to embedEndpoint.
    #   Example: embedModel: "nomic-embed-text"
  # --- Contradiction / supersede gate (plan-living-memory-slice-2-temporal-model) ---
  # When a new decision/correction is captured, Massu finds related past records
  # and, if the new one CONTRADICTS an old one, marks the old record superseded
  # (keeps its history, hides it from current recall) instead of letting both
  # coexist. Runs in the session-end sweep; fully fail-open + local by default.
  contradiction:
    # enabled: master switch. false → every memory is kept as-is (no superseding).
    enabled: true
    # judgeEndpoint (optional): a stronger external judge (OpenAI-compatible).
    #   Unset (default) = local heuristic only, ZERO egress. When set, the new
    #   record + related records egress ONLY to this endpoint you choose.
    # similarityThreshold: how alike two records must be (0–1) to be considered
    #   the same topic. Calibrated to the bundled model (contradictions ≈0.65–0.86).
    similarityThreshold: 0.6
    # dedupThreshold: at/above this similarity a new record is a near-duplicate
    #   (kept, nothing superseded).
    dedupThreshold: 0.93
    # gatedTypes: which memory kinds the gate runs for. High-volume file edits are
    #   intentionally excluded so normal work is never slowed.
    gatedTypes:
      - decision
      - cr_violation
      - failed_attempt
    # annotateSuperseded: when true, superseded records may still appear in recall
    #   labeled "(superseded on <date> by #<id>)" instead of being hidden.
    annotateSuperseded: false
    # budgetMs: time budget for the check; exceeded → nothing superseded (fail-open).
    budgetMs: 800

  # --- Background consolidation, the "sleep-time" pass
  #     (plan-living-memory-slice-3-consolidation) ---
  # Keeps memory sharp over years: merges duplicates, distills each session into
  # ONE durable lesson before its raw transcript is deleted, spots corrections
  # you keep repeating, notices which memories actually get used, and retires
  # dead weight by EXPIRING it (it is never deleted — history stays answerable).
  #
  # Runs with ZERO AI model and ZERO network by default. It happens
  # automatically at session end; `massu consolidate` runs a full pass on demand.
  consolidation:
    # enabled: master switch for the whole pass.
    enabled: true
    # sessionSweepEnabled: do a small, bounded slice of the work at session end.
    #   This is what makes consolidation automatic with no scheduler at all.
    sessionSweepEnabled: true

    # --- OPTIONAL: a local AI model (improves ONE thing only) ---
    # By default, a session's lesson is built by SELECTING the most important
    # lines Massu already recorded. Point llmEndpoint at a local model (Ollama,
    # LM Studio, any OpenAI-compatible server) and it will instead write that
    # lesson as readable prose. That is the ONLY difference: merging duplicates,
    # spotting repeated mistakes, reweighting and expiry are all arithmetic and
    # are already at full strength without it.
    #
    # Leave these UNSET (the default) and nothing ever leaves your machine.
    # NOTE: the API key is NEVER put here — this file is committed to git. It is
    # read only from the MASSU_MEMORY_LLM_API_KEY environment variable.
    #   Example: llmEndpoint: "http://localhost:11434"
    #            llmModel: "llama3.1:8b"

    # summarizeAfterDays: distill a session once it is this old. MUST stay below
    #   7 — raw transcripts are deleted at 7 days, so a larger value would let
    #   the raw material die before the lesson is ever written.
    summarizeAfterDays: 5
    # retentionDays: how old a memory must be before it can be retired at all.
    retentionDays: 90
    # importanceFloor: only memories at or below this importance (1-5) can be retired.
    importanceFloor: 2
    # protectedTypes: these are NEVER retired, however old and however unused.
    protectedTypes:
      - decision
      - cr_violation
      - incident_near_miss
    # usageWarmupDays: Massu refuses to retire ANYTHING until it has watched
    #   which memories you actually use for this long. On a fresh install nothing
    #   has "ever been used" yet — without this, the first run would retire
    #   almost everything you have.
    usageWarmupDays: 30
    # usageDecay: usefulness must be SUSTAINED — each pass fades the usage score,
    #   so one accidental retrieval years ago does not keep junk alive forever.
    usageDecay: 0.9
    # reweightIntervalDays: also the GRACE PERIOD — a memory that just got
    #   downgraded survives at least this long, so a retrieval can rescue it.
    reweightIntervalDays: 1
    # promoteMinOccurrences: how many times you must repeat a correction (across
    #   at least 2 sessions) before Massu proposes it as a rule. It only ever
    #   PROPOSES — you approve it via /massu-rule.
    promoteMinOccurrences: 3
    # budgetMs: time budget for the automatic session-end slice.
    budgetMs: 3000
    # suggestUpgrades: tell you in chat when Massu spots an optional upgrade on
    #   your machine (e.g. "you have a local model — your session lessons could
    #   read as prose"). Shown once, again if your setup changes, and otherwise
    #   at most every suggestIntervalDays. Massu NEVER turns it on by itself.
    suggestUpgrades: true
    suggestIntervalDays: 30
