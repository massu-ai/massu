project:
  name: inventory-monorepo
  root: auto
framework:
  type: typescript
  router: trpc
  orm: prisma
  ui: nextjs
paths:
  source: src
  aliases:
    "@": src
toolPrefix: inventory
domains:
  - name: Inventory
    routers: [inventory]
    pages: []
    tables: []
    allowedImportsFrom: []
rules:
  - pattern: src/**/*.ts
    rules:
      - Use ESM imports, not CommonJS
